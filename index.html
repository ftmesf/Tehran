<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>بزرگراه‌های تهران — Tehran Highways</title>
<style>/* Tehran highways app. Colour tokens for the map (--ink, --casing, --accent, ...) come from the inlined SVG's <style>; these are the page-only ones. */
:root{--page-bg:#f4f1e8;--card:#ffffff;--border:#17202b1f;--code-bg:#f3f1ea;--chip:#ffffff;--btn:#17202b;--btn-ink:#ffffff;
  --c-v:#1565C0;--c-h:#B85400;--c-x:#7B1FA2;--ok:#1b7a3a;--ok-bg:#e3f4e8;--bad:#b3261e;--bad-bg:#fdeceb;--warn-bg:#fff3c4;--warn-ink:#6b4e00;
  --row-hover:#0000000d;--kw:#8e24aa;--str:#00695c;--halo:#e53935;--trail:#00897b;--shadow:0 6px 24px #17202b1a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#0f151c;--card:#16202a;--border:#ffffff26;--code-bg:#0c1218;--chip:#1b2631;--btn:#e9eef4;--btn-ink:#0f151c;
  --c-v:#64B5F6;--c-h:#FFB74D;--c-x:#CE93D8;--ok:#6fdc8c;--ok-bg:#14301d;--bad:#ff8a80;--bad-bg:#3a1a18;--warn-bg:#3d3313;--warn-ink:#ffe08a;--row-hover:#ffffff12;--kw:#ce93d8;--str:#80cbc4;--halo:#ff6b5b;--trail:#4db6ac;--shadow:0 6px 24px #0008}}
:root[data-theme="dark"]{--page-bg:#0f151c;--card:#16202a;--border:#ffffff26;--code-bg:#0c1218;--chip:#1b2631;--btn:#e9eef4;--btn-ink:#0f151c;
  --c-v:#64B5F6;--c-h:#FFB74D;--c-x:#CE93D8;--ok:#6fdc8c;--ok-bg:#14301d;--bad:#ff8a80;--bad-bg:#3a1a18;--warn-bg:#3d3313;--warn-ink:#ffe08a;--row-hover:#ffffff12;--kw:#ce93d8;--str:#80cbc4;--halo:#ff6b5b;--trail:#4db6ac;--shadow:0 6px 24px #0008}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page-bg);color:var(--ink);font-family:'Vazirmatn','DejaVu Sans',system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100dvh;overflow:hidden;line-height:1.75;font-size:16px}
button{font:inherit;color:inherit}
a{color:inherit}
.c-v{color:var(--c-v)}.c-h{color:var(--c-h)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:8px 14px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border)}
.brand{display:flex;flex-direction:column;line-height:1.2;flex:none}
.brand b{font-size:19px;font-weight:800}
.brand small{font-size:11px;opacity:.65;direction:ltr;text-align:start}
.levels{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.levels::-webkit-scrollbar{display:none}
.lv{flex:none;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--border);background:var(--chip);border-radius:999px;padding:3px 14px 3px 10px;cursor:pointer;font-weight:800;font-size:14px}
.lv .lvn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--code-bg);font-size:13px}
.lv.cur{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}.lv.cur .lvn{background:#ffffff30}
.lv.done:not(.cur) .lvn{background:var(--ok-bg);color:var(--ok)}
.lv:disabled{opacity:.45;cursor:not-allowed}
.tools{display:flex;gap:6px;flex:none;order:3}
.tool{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--border);background:var(--chip);cursor:pointer;font-size:16px;font-weight:800;line-height:1;display:inline-grid;place-items:center}
.tool[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.tool[hidden]{display:none}
:focus-visible{outline:3px solid var(--halo);outline-offset:2px}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
#map-pane{position:relative;min-height:0;min-width:0;overflow:hidden}
#map-scroll{position:absolute;inset:0;touch-action:none;cursor:grab}
#map-scroll:active{cursor:grabbing}
/* The page is RTL but the map is a picture: north up, east right. Persian labels carry their own direction="rtl". */
#map-scroll svg{width:100%;height:100%;display:block;direction:ltr}
#panel{border-inline-start:1px solid var(--border);overflow:auto;background:var(--card);min-height:0}
.mapbtns{position:absolute;inset-inline-end:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapbtns .tool{box-shadow:var(--shadow)}
.credit{position:absolute;inset-inline-end:10px;bottom:6px;font-size:11px;background:var(--card);opacity:.9;padding:1px 8px;border-radius:8px}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;font-size:11px}
#real-note{position:absolute;inset-inline:64px;top:12px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:8px 14px;font-size:14px;box-shadow:var(--shadow);max-width:560px;margin-inline:auto}
@media (max-width:860px){
  .top{flex-wrap:wrap;padding:6px 10px;gap:4px 8px}
  .brand{order:1;margin-inline-end:auto}.brand b{font-size:16px}.brand small{display:none}
  .tools{order:2}.tool{width:34px;height:34px}
  .levels{order:3;flex-basis:100%}
  .lv{padding:2px 10px 2px 8px;font-size:13px}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,50dvh)}
  #panel{border-inline-start:0;border-top:1px solid var(--border)}
}

/* ---------- map: what the app changes on the picture ---------- */
svg .off{display:none}
svg #legend{display:none}
svg:not(.z) .pill-en,svg:not(.z) .lm-en{display:none}
svg:not(.z) .pill-fa{transform:translateY(9px)}
svg .hit,svg [data-node],svg .hw-label,svg .landmark{cursor:pointer}
svg .core,svg .casing,svg .special-outline,svg .tunnel,svg .node,svg .hw-label,svg .landmark{transition:opacity .2s}
svg .dim,svg .ghost{opacity:.2}
svg .ghost{filter:grayscale(1)}
svg .sel{opacity:1;filter:none}
svg .halo-under{fill:none;stroke:var(--halo);stroke-opacity:.5;stroke-width:54;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
svg .halo-ring{fill:none;stroke:var(--halo);stroke-width:9;pointer-events:none}
svg .halo-ring-soft{fill:var(--halo);fill-opacity:.2;pointer-events:none}
svg .car-layer{pointer-events:none}
svg .trail{fill:none;stroke:var(--trail);stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 24;opacity:.95}
svg .trail-head{fill:var(--trail)}
svg .car-body{fill:#ffc107;stroke:#17202b;stroke-width:4}.car-glass{fill:#90caf9;stroke:#17202b;stroke-width:2.5}
svg .car-light{fill:#fff59d;stroke:#17202b;stroke-width:1.5}.car-wheel{fill:#263238}
svg .car-glass{fill:#90caf9;stroke:#17202b;stroke-width:2.5}
svg.is-real #highways,svg.is-real #hit-segments,svg.is-real #nodes,svg.is-real #highway-labels,svg.is-real #landmarks{display:none}
svg:not(.is-real) .real{display:none}
svg .real-casing{fill:none;stroke:var(--casing);stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
svg .real-core{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
svg .real-outline{fill:none;stroke:var(--special-dash);stroke-width:15;stroke-dasharray:10 8;stroke-linejoin:round}
svg .real-node{stroke-width:3}
svg .real-label .pill{stroke-width:3}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 #ffd54f)}50%{filter:drop-shadow(0 0 22px #ffd54f) brightness(1.15)}}
svg .pulse{animation:glow 1.3s ease-in-out infinite}
@keyframes bright{0%,100%{filter:none}50%{filter:brightness(1.3) saturate(1.4)}}
svg #mountains.pulse{animation:bright 1.3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){svg *{transition:none!important;animation:none!important}}

/* ---------- lesson card ---------- */
.card{padding:16px 18px 28px;display:flex;flex-direction:column;gap:10px;min-height:100%}
.kick{display:flex;align-items:center;font-size:13px;font-weight:800;opacity:.8}
.kick span{flex:1}
.x{border:1.5px solid var(--border);background:var(--chip);border-radius:10px;width:32px;height:32px;cursor:pointer;font-size:14px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--code-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--trail);border-radius:99px;transition:width .3s}
.dots{display:flex;gap:6px;height:100%;align-items:center;padding:0 2px}
.dot-p{flex:1;height:8px;border-radius:99px;background:var(--border)}
.dot-p.ok{background:var(--ok)}.dot-p.bad{background:var(--bad)}
.qt{margin:6px 0 0;font-size:25px;line-height:1.55;font-weight:800}
.hwn{white-space:nowrap}.hwn i{display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-inline-end:.3em;vertical-align:.05em;border:1.5px solid var(--ink)}
.en-sub{font-size:13px;opacity:.65;text-align:left;margin-top:-6px}
.body{font-size:18px}
.body p{margin:6px 0}.body .big{font-size:24px;font-weight:800}
.body .seq{font-size:17px;font-weight:800;background:var(--code-bg);border-radius:12px;padding:6px 12px}
.tiphint{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700}
.choices{display:grid;gap:10px;margin-top:6px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:start;border:2px solid var(--border);background:var(--chip);border-radius:16px;padding:10px 16px;min-height:58px;cursor:pointer;font-size:19px;font-weight:800;transition:transform .1s,border-color .1s}
.choice:hover:not(:disabled){border-color:var(--btn);transform:translateY(-1px)}
.choice small{font-size:12px;font-weight:400;opacity:.65}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fbbox{border-radius:14px;padding:10px 14px;font-size:17px;line-height:1.7}
.fbbox.ok{background:var(--ok-bg);color:var(--ok)}.fbbox.bad{background:var(--bad-bg);color:var(--bad)}.fbbox.hint{background:var(--warn-bg);color:var(--warn-ink)}
.fbbox b{font-weight:800}
.fbbox small{opacity:.85}
.foot-slot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:6px}
.nextrow{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.btn{border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-weight:800;font-size:18px;padding:11px 26px;cursor:pointer;min-height:50px}
.btn.ghost{background:var(--chip);color:var(--ink);border:2px solid var(--border)}
.btn:hover{filter:brightness(1.1)}
.rowline{display:block;background:var(--code-bg);border-radius:10px;padding:5px 10px;font:12.5px ui-monospace,Menlo,Consolas,monospace;text-align:left;overflow:auto;white-space:nowrap}
.lmlist{display:grid;gap:8px;margin-top:6px}
.lmrow{display:flex;flex-direction:column;align-items:flex-start;text-align:start;border:1.5px solid var(--border);background:var(--chip);border-radius:14px;padding:8px 14px;cursor:pointer}
.lmrow b{font-size:19px}.lmrow span{font-size:14px;opacity:.85}.lmrow i{opacity:.75}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mini{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px}
.mini i{width:12px;height:12px;border-radius:50%}
.score{font-size:20px}.score b{font-size:34px}

/* ---------- developer view (hidden unless asked for) ---------- */
details.dev{border:1.5px dashed var(--border);border-radius:12px;padding:0 12px;margin:4px 0}
details.dev summary{cursor:pointer;font-size:13px;font-weight:800;padding:8px 0;opacity:.8;direction:ltr;text-align:left}
details.dev[open] summary{border-bottom:1px solid var(--border);margin-bottom:6px}
.devh{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:14px;font-weight:800}
.devh code{font-weight:400;font-size:12px;opacity:.7}
pre.sql{direction:ltr;text-align:left;background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:6px 0;overflow:auto;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
pre.sql .kw{color:var(--kw);font-weight:700}pre.sql .str{color:var(--str)}pre.sql .cm{opacity:.6}
.tw{direction:ltr;overflow:auto;border:1px solid var(--border);border-radius:10px;margin:6px 0 4px}
table{border-collapse:collapse;width:100%;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
th,td{padding:4px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--code-bg);font-weight:700}
tr:last-child td{border-bottom:0}
table.kv th{width:1%}
td.fa{font-family:'Vazirmatn',sans-serif;direction:rtl;font-size:13.5px}
tr[data-go]{cursor:pointer}tr[data-go]:hover{background:var(--row-hover)}
.t{color:var(--ok);font-weight:700}.f{color:var(--warn-ink);background:var(--warn-bg);border-radius:4px;padding:0 4px;font-weight:700}.nul{opacity:.5}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}
.rows{font-size:12px;opacity:.7;margin:0 0 6px;direction:ltr;text-align:left}
.note{font-size:13px;opacity:.85;margin:6px 0;direction:ltr;text-align:left}
.src{font-size:13px;padding-inline-start:18px;margin:6px 0}
.foot{font-size:12px;opacity:.7;margin-top:18px;border-top:1px solid var(--border);padding-top:10px}
.join{font-size:21px;font-weight:800;margin:8px 0 2px}
.join .go,.go{background:none;border:0;padding:0;cursor:pointer;font:inherit;text-decoration:underline dotted}

/* ---------- explore panel ---------- */
.p{padding:14px 16px 28px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--border);background:var(--chip);border-radius:999px;padding:3px 14px;cursor:pointer;font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.plain{font-size:17px;margin:6px 0 12px}
.plain small{opacity:.75;font-size:13px}
.hwlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0 14px}
.hwbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);background:var(--chip);border-radius:12px;padding:7px 10px;cursor:pointer;text-align:start}
.hwbtn small{opacity:.65;font-size:11px;direction:ltr;margin-inline-start:auto}
.hwbtn .dot{margin:0;flex:none}
.ph{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.swatch{width:12px;align-self:stretch;border-radius:6px;flex:none;min-height:48px}
.ph h2{margin:0;font-size:26px;line-height:1.25}
.ph small.en{display:block;font-size:13px;opacity:.75;direction:ltr;text-align:start}
.ph .x{margin-inline-start:auto}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.badge{flex:none;white-space:nowrap;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:800;border:1.5px solid currentColor}
.badge.v{color:var(--c-v)}.badge.h{color:var(--c-h)}.badge.x{color:var(--c-x);border-style:dashed}
.badge.ok{color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}.badge.n{color:var(--ink-soft)}
.warnbox{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:8px 12px;font-size:14px;margin:10px 0}
</style>
</head>
<body data-mode="learn">
<header class="top">
  <div class="brand"><b>بزرگراه‌های تهران</b><small>Tehran Highways for Backend Developers</small></div>
  <div class="tools">
    <button class="tool" id="realbtn" hidden aria-pressed="false" title="شکل واقعی / شماتیک" aria-label="شکل واقعی یا شماتیک">🗺</button>
    <button class="tool" id="devbtn" aria-pressed="false" title="نمای برنامه‌نویس (جدول و SQL)" aria-label="نمای برنامه‌نویس">{ }</button>
    <button class="tool" id="theme" aria-label="روشن / تاریک" title="روشن / تاریک">◐</button>
  </div>
  <nav class="levels" id="levels" aria-label="درس‌ها"></nav>
</header>
<main>
  <div id="map-pane">
    <div id="map-scroll"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" role="img" aria-label="Schematic map of Tehran highways, north is up">

  svg{font-family:'Vazirmatn','DejaVu Sans',sans-serif}

  .lm-en{font-size:14px;fill:var(--ink-soft);paint-order:stroke;stroke:var(--casing);stroke-width:4;stroke-linejoin:round}
  .cmp-ring{fill:var(--panel);stroke:var(--ink);stroke-width:4}

  .cmp-banner{fill:var(--accent)}.cmp-north-text{font-size:26px;font-weight:800;fill:#ffffff}

  .replace(KW, '<span class="kw">$1</span>').replace(/\u0001/g, '<span class="cm">').replace(/\u0002/g, '</span>')}</pre>`;
const COLS = {
  highways: ['id', 'name_fa', 'name_en', 'orientation', 'color', 'level', 'verified', 'source'],
  nodes: ['id', 'name_fa', 'name_en', 'type', 'x', 'y', 'verified', 'source'],
  landmarks: ['id', 'node_id', 'name_fa', 'name_en', 'icon', 'hint_fa', 'elevation_m', 'verified', 'source']
};
const q = (cols, table, where) => `SELECT ${cols.join(', ')}\nFROM ${table}${where ? '\nWHERE ' + where : ''};`;
// <details> that follows the global "Developer view" switch
const devDetails = (title, inner) => `<details class="dev"${state.dev ? ' open' : ''}><summary>${title}</summary>${inner}</details>`;
const syncDev = () => { document.body.classList.toggle('dev-on', state.dev); document.querySelectorAll('details.dev').forEach(d => { d.open = state.dev; }); };

// ---------- svg helpers ----------
const mk = (tag, cls, attrs = {}) => { const e = document.createElementNS(NS_URI, tag); if (cls) e.setAttribute('class', cls); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const under = mk('g', 'sel-under'), over = mk('g', 'sel-over'), carLayer = mk('g', 'car-layer');
svg.insertBefore(under, svg.querySelector('#highways'));
svg.appendChild(over);
svg.appendChild(carLayer);
const pathD = pts => pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x} ${y}`).join(' ');

// ---------- what is on the map ----------
// vis.hw: Set of highway ids that exist right now (null = all). Everything else is hidden, not greyed: no clutter.
const vis = { hw: null, landmarks: true, mountains: true, nodes: 'meet' };
function applyVisibility() {
  const on = id => !vis.hw || vis.hw.has(id);
  svg.querySelectorAll('[data-highway]').forEach(el => el.classList.toggle('off', !on(el.dataset.highway)));
  const visibleAt = id => hwsAtNode(id).filter(on).length;
  svg.querySelectorAll('[data-node]').forEach(el => {
    const t = ND.get(el.dataset.node).type;
    const show = vis.nodes === 'all' ? visibleAt(el.dataset.node) >= 1 && t !== 'waypoint'
      : vis.nodes === 'meet' ? visibleAt(el.dataset.node) >= 2 : false;
    el.classList.toggle('off', !show);
  });
  svg.querySelectorAll('[data-landmark]').forEach(el => el.classList.toggle('off', !vis.landmarks));
  svg.classList.toggle('no-nodes', vis.nodes === false);
}
function setVisible(opts) { Object.assign(vis, opts); applyVisibility(); }

// ---------- camera (viewBox) ----------
const FULL = [0, 0, 1600, 1400];
let vb = FULL.slice(), vbAnim = 0;
const setVB = b => { vb = b; svg.setAttribute('viewBox', b.map(v => Math.round(v * 10) / 10).join(' ')); svg.classList.toggle('z', b[2] < 1000); };
function animateVB(to, ms = 650) {
  cancelAnimationFrame(vbAnim);
  const from = vb.slice(), t0 = performance.now();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return setVB(to);
  const step = t => {
    const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    setVB(from.map((v, i) => v + (to[i] - v) * e));
    if (k < 1) vbAnim = requestAnimationFrame(step);
  };
  vbAnim = requestAnimationFrame(step);
}
// Fit a box (in drawing units) to the pane's shape, so the map never letterboxes while zoomed.
function fitBox([x0, y0, x1, y1], pad = 120) {
  const a = Math.max(.4, pane.clientWidth / Math.max(1, pane.clientHeight));
  let w = x1 - x0 + 2 * pad, h = y1 - y0 + 2 * pad;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  // never zoom in so far that the lesson loses its surroundings: a wide screen keeps most of the map, a phone keeps about a third
  const minW = pane.clientWidth >= 700 ? 1150 : 560;
  if (w < minW) { h *= minW / w; w = minW; }
  if (w / h < a) w = h * a; else h = w / a;
  if (w >= FULL[2] || h >= FULL[3]) return FULL.slice();
  return [Math.min(Math.max(cx - w / 2, 0), FULL[2] - w), Math.min(Math.max(cy - h / 2, 0), FULL[3] - h), w, h];
}
const boxOf = pts => [Math.min(...pts.map(p => p[0])), Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[0])), Math.max(...pts.map(p => p[1]))];
const focusOn = (pts, pad) => animateVB(pts && pts.length ? fitBox(boxOf(pts), pad) : FULL.slice());
const focusAll = () => animateVB(FULL.slice());

// pan (drag) and zoom (wheel / buttons). A drag never counts as a click.
let dragged = false;
(() => {
  let down = null;
  const pxToUnits = () => vb[2] / Math.min(scroller.clientWidth, scroller.clientHeight * vb[2] / vb[3]);
  scroller.addEventListener('pointerdown', e => { if (e.button === 0) down = { x: e.clientX, y: e.clientY, vb: vb.slice(), moved: false }; });
  scroller.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!down.moved && Math.hypot(dx, dy) < 7) return;
    down.moved = true; cancelAnimationFrame(vbAnim);
    const k = pxToUnits();
    setVB([Math.min(Math.max(down.vb[0] - dx * k, 0), FULL[2] - vb[2]), Math.min(Math.max(down.vb[1] - dy * k, 0), FULL[3] - vb[3]), vb[2], vb[3]]);
  });
  const up = () => { dragged = !!(down && down.moved); down = null; setTimeout(() => { dragged = false; }, 0); };
  scroller.addEventListener('pointerup', up); scroller.addEventListener('pointercancel', up);
})();
function zoomBy(f, cx, cy) {
  const w = Math.min(FULL[2], Math.max(320, vb[2] / f)), h = w * vb[3] / vb[2];
  const px = cx ?? vb[0] + vb[2] / 2, py = cy ?? vb[1] + vb[3] / 2;
  const nx = px - (px - vb[0]) * w / vb[2], ny = py - (py - vb[1]) * h / vb[3];
  animateVB(w >= FULL[2] ? FULL.slice() : [Math.min(Math.max(nx, 0), FULL[2] - w), Math.min(Math.max(ny, 0), FULL[3] - h), w, h], 220);
}
scroller.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect(), k = Math.min(r.width / vb[2], r.height / vb[3]);
  const ox = (r.width - vb[2] * k) / 2, oy = (r.height - vb[3] * k) / 2;
  zoomBy(e.deltaY < 0 ? 1.25 : .8, vb[0] + (e.clientX - r.left - ox) / k, vb[1] + (e.clientY - r.top - oy) / k);
}, { passive: false });

// ---------- halos (what is selected / the right answer) ----------
function clearHalos() { under.replaceChildren(); over.replaceChildren(); }
function halo(type, id) {
  if (state.real) return;
  if (type === 'highway') under.append(mk('path', 'halo-under', { d: pathD(nodesOfHw(id).map(P)) }));
  else if (type === 'segment') { const s = SG.get(id); under.append(mk('path', 'halo-under', { d: pathD([P(s.from_node), P(s.to_node)]) })); }
  else if (type === 'node' || type === 'landmark') {
    const [x, y] = P(type === 'node' ? id : LM.get(id).node_id), r = type === 'node' ? 34 : 56;
    over.append(mk('circle', 'halo-ring-soft', { cx: x, cy: y, r }), mk('circle', 'halo-ring', { cx: x, cy: y, r }));
  }
}
const pulse = (el, on) => el && el.classList.toggle('pulse', on);

// ---------- the car mascot ----------
function carShape() {
  const g = mk('g', 'car'), inner = mk('g', '', { transform: 'scale(1.55)' });
  g.append(inner);
  inner.innerHTML = `<rect x="-36" y="-20" width="72" height="40" rx="12" class="car-body"/>
    <rect x="-8" y="-15" width="26" height="30" rx="6" class="car-glass"/><rect x="-26" y="-13" width="12" height="26" rx="4" class="car-glass"/>
    <circle cx="33" cy="-11" r="4" class="car-light"/><circle cx="33" cy="11" r="4" class="car-light"/>
    <rect x="-28" y="-25" width="16" height="7" rx="3" class="car-wheel"/><rect x="14" y="-25" width="16" height="7" rx="3" class="car-wheel"/>
    <rect x="-28" y="18" width="16" height="7" rx="3" class="car-wheel"/><rect x="14" y="18" width="16" height="7" rx="3" class="car-wheel"/>`;
  return g;
}
const polyLen = pts => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
function pointAt(pts, d) {
  for (let i = 1; i < pts.length; i++) {
    const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (d <= L || i === pts.length - 1) { const t = L ? Math.min(1, d / L) : 1; return { x: pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, y: pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t, a: Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0]) }; }
    d -= L;
  }
}
// Drive the car along a polyline (drawing units) with a dashed arrow trail. Resolves when it arrives.
function driveCar(pts) {
  carLayer.replaceChildren();
  if (state.real || pts.length < 2) return Promise.resolve();
  const end = pts[pts.length - 1], prev = pts[pts.length - 2], ang = Math.atan2(end[1] - prev[1], end[0] - prev[0]);
  const trail = mk('path', 'trail', { d: pathD(pts) });
  const head = mk('path', 'trail-head', { d: 'M0 0 L-46 -27 L-46 27 Z', transform: `translate(${end[0]} ${end[1]}) rotate(${ang * 180 / Math.PI})` });
  const car = carShape();
  carLayer.append(trail, head, car);
  const total = polyLen(pts), ms = Math.min(1700, 700 + total * 1.6), t0 = performance.now();
  const place = d => { const p = pointAt(pts, d); car.setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${p.a * 180 / Math.PI})`); };
  place(0);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { place(total); return Promise.resolve(); }
  return new Promise(res => {
    const step = t => { const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; place(total * e); k < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
}
const clearCar = () => carLayer.replaceChildren();
function parkCar(p, deg = 0) {
  carLayer.replaceChildren();
  if (state.real) return;
  const c = carShape(); c.setAttribute('transform', `translate(${p[0]} ${p[1]}) rotate(${deg})`); carLayer.append(c);
}

// ===== real-shape view: the same highways drawn with their real carriageway shapes (north still up) =====
// The schematic keeps ORDER and throws away distance; this view keeps both, so the learner can see what the schematic changed.
let realG = null;
function buildReal() {
  realG = mk('g', 'real', { id: 'real' });
  svg.insertBefore(realG, svg.querySelector('#highways'));
  const R = D.real, hwIds = D.highways.map(h => h.id);
  const dOf = flat => { let d = ''; for (let i = 0; i < flat.length; i += 2) d += `${i ? 'L' : 'M'}${flat[i]} ${flat[i + 1]}`; return d; };
  // draw order: verticals/horizontals first, exceptions on top (same rule as the schematic)
  const order = [...hwIds].sort((a, b) => (group(HW.get(a)) === 'X') - (group(HW.get(b)) === 'X'));
  for (const id of order) {
    const h = HW.get(id), lines = R.lines[id] || [], special = group(h) === 'X';
    const d = lines.map(dOf).join(' ');
    realG.append(mk('path', 'real-casing', { d, 'data-highway': id }));
    if (special) realG.append(mk('path', 'real-outline', { d, 'data-highway': id }));
    realG.append(mk('path', 'real-core', { d, stroke: h.color, 'data-highway': id }));
  }
  for (const n of D.nodes) if (n.type === 'interchange' && R.nodes[n.id])
    realG.append(mk('circle', 'node real-node', { cx: R.nodes[n.id][0], cy: R.nodes[n.id][1], r: 9, 'data-node': n.id }));
  // Labels: sit at the real end of each line that is nearest to where its schematic label sits, nudged apart if they collide.
  const at = el => { const m = /translate\(([-\d.]+) ([-\d.]+)\)/.exec(el.getAttribute('transform')); return [+m[1], +m[2]]; };
  const labels = [];
  for (const pill of svg.querySelectorAll('.hw-label')) {
    const id = pill.dataset.highway, ids = nodesOfHw(id).filter(n => R.nodes[n]);
    if (ids.length < 2) continue;
    const [px, py] = at(pill), dist = n => Math.hypot(P(n)[0] - px, P(n)[1] - py);
    const first = dist(ids[0]) <= dist(ids[ids.length - 1]);
    const end = first ? ids[0] : ids[ids.length - 1], next = first ? ids[1] : ids[ids.length - 2];
    const [ex, ey] = R.nodes[end], [nx, ny] = R.nodes[next], len = Math.hypot(ex - nx, ey - ny) || 1;
    const c = pill.cloneNode(true), w = +c.querySelector('rect').getAttribute('width');
    c.classList.add('real-label');
    labels.push({ c, w, x: ex + (ex - nx) / len * 62, y: ey + (ey - ny) / len * 62, dy: Math.sign(ey - ny) || 1 });
  }
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (const a of labels) for (const b of labels) if (a !== b && Math.abs(a.x - b.x) < (a.w + b.w) / 2 + 6 && Math.abs(a.y - b.y) < 66) { b.y += b.dy * 8; moved = true; }
    if (!moved) break;
  }
  for (const l of labels) { l.c.setAttribute('transform', `translate(${Math.round(l.x)} ${Math.round(l.y)})`); realG.append(l.c); }
  for (const lm of svg.querySelectorAll('.landmark')) {
    const pos = R.nodes[LM.get(lm.dataset.landmark).node_id]; if (!pos) continue;
    const c = lm.cloneNode(true); c.classList.add('real-landmark'); c.setAttribute('transform', `translate(${pos[0]} ${pos[1]})`);
    realG.append(c);
  }
  applyVisibility();
}
function setReal(on) {
  if (on && !realG) buildReal();
  state.real = on;
  svg.classList.toggle('is-real', on);
  document.getElementById('real-note').hidden = !on;
  const b = document.getElementById('realbtn'); if (b) b.setAttribute('aria-pressed', String(on));
  clearHalos(); clearCar();
}

// ===== explore mode: click anything, see what it is in plain words, and (on request) the table rows and SQL behind it =====
const E = { sel: null, filter: 'all' };

const verifiedBadge = r => r.verified ? '<span class="badge ok">تأییدشده ✓</span>' : '<span class="badge warn">تأییدنشده</span>';
const oriBadge = h => `<span class="badge ${ORI[h.orientation].cls}">${ORI[h.orientation].label}${ORI[h.orientation].sub ? ' · ' + ORI[h.orientation].sub : ''}</span>`;
const unverifiedBox = (r, what) => r.verified ? '' :
  `<div class="warnbox">⚠ این ${what} هنوز <b>تأییدنشده</b> است (verified = false): با OpenStreetMap به‌طور کامل نمی‌خواند، پس به‌عنوان حقیقت قطعی نخوانش. جزئیات در REVIEW.md.${r.note ? `<br><span dir="ltr" style="display:block;text-align:left">${esc(r.note)}</span>` : ''}</div>`;
const noteLine = r => r.note ? `<div class="note">note: ${esc(r.note)}</div>` : '';
const sourcesBlock = rows => {
  const ids = [...new Set(rows.flatMap(r => [...(r.source || []), ...(r.alias_source || [])]))].filter(id => SRC.has(id));
  if (!ids.length) return '';
  return `<div class="devh">منبع <code>sources</code></div><ul class="src">${ids.map(id => {
    const s = SRC.get(id); return `<li dir="ltr" style="text-align:left"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`;
  }).join('')}</ul>`;
};
const head = (r, color) => `<div class="ph"><span class="swatch" style="background:${esc(color || 'var(--ink-soft)')}"></span><div><h2>${esc(nm(r))}</h2><small class="en">${esc(r.name_en || '')}</small></div>
  <button class="x" data-close aria-label="بستن" title="بستن (Esc)">✕</button></div>`;
const footer = `<div class="foot">«تأییدشده» یعنی هندسه‌ی OpenStreetMap با این ردیف می‌خواند؛ <b>نه</b> اینکه پیچیدن از یک خط به خط دیگر مجاز باشد. ·
  Geography © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL)</div>`;
const HIDDEN = '-- lat, lon exist in this table; hidden here\n';
const DEV_TITLE = 'نمای برنامه‌نویس · Developer view';

const filtersBar = () => `<div class="filters" role="group" aria-label="فیلتر بزرگراه‌ها">${[['all', 'همه', null], ['NS', 'عمودی', 'var(--c-v)'], ['EW', 'افقی', 'var(--c-h)'], ['X', 'استثنا', 'var(--c-x)']]
  .map(([k, label, c]) => `<button class="chip" data-f="${k}" aria-pressed="${E.filter === k}">${c ? `<i style="background:${c}"></i>` : ''}${label}</button>`).join('')}</div>`;

function renderHome() {
  const hs = [...D.highways].sort((a, b) => a.level - b.level || group(a).localeCompare(group(b)));
  const all = [...D.highways, ...D.nodes, ...D.segments, ...D.landmarks];
  const ok = all.filter(r => r.verified).length;
  return `<div class="p">${filtersBar()}
    <p class="plain">روی هر <b>خط</b>، <b>دایره</b> یا <b>نماد</b> بزن.<br><small>یک بار روی خط = کل بزرگراه · دوباره روی همان خط = همان قطعه · Esc = بستن</small></p>
    <div class="hwlist">${hs.map(h => `<button class="hwbtn" data-go="highway:${h.id}"><span class="dot" style="background:${esc(h.color)}"></span><b>${esc(h.name_fa)}</b><small>${esc(h.name_en)}</small></button>`).join('')}</div>
    ${devDetails(DEV_TITLE, sql(q(['id', 'name_fa', 'name_en', 'orientation', 'level', 'verified'], 'highways').replace(';', '\nORDER BY level, orientation;')) +
      listTable(['id', 'name_fa', 'name_en', 'orientation', 'level', 'verified'], hs, r => 'highway:' + r.id) +
      `<div class="rows">${ok} / ${all.length} rows verified (highways, nodes, segments, landmarks)</div>`)}
    ${footer}</div>`;
}

function endsText(h) {
  const ns = nodesOfHw(h.id).map(id => ND.get(id)), segs = segsOfHw.get(h.id) || [];
  const by = (k, dir) => [...ns].sort((a, b) => dir * (a[k] - b[k]))[0];
  if (h.orientation === 'NS') return `سر بالا (شمال): <b>${esc(nm(by('y', 1)))}</b><br>سر پایین (جنوب): <b>${esc(nm(by('y', -1)))}</b>`;
  if (h.orientation === 'EW') return `سر چپ (غرب): <b>${esc(nm(by('x', 1)))}</b><br>سر راست (شرق): <b>${esc(nm(by('x', -1)))}</b>`;
  const seq = []; for (const s of segs) if (seq[seq.length - 1] !== s.direction) seq.push(s.direction);
  return `ترتیب جهت‌ها: <b>${seq.map(d => `${DIR_FA[d]} ${ARROW[d]}`).join('، بعد ')}</b>`;
}
const plainOf = h => h.orientation === 'NS' ? 'خط <b>عمودی</b>: روی نقشه از بالا (شمال، سمت کوه) به پایین (جنوب) کشیده می‌شود.'
  : h.orientation === 'EW' ? 'خط <b>افقی</b>: روی نقشه از چپ (غرب) به راست (شرق) کشیده می‌شود.'
  : h.orientation === 'MIXED' ? '<b>استثنا</b>: وسط راه جهتش را عوض می‌کند — بخشی افقی، بخشی عمودی.'
  : '<b>استثنا</b>: مورب است، نه عمودی و نه افقی.';

function renderHighway(id) {
  const h = HW.get(id), segs = segsOfHw.get(id) || [];
  const crossings = [];
  for (const nid of nodesOfHw(id)) for (const o of hwsAtNode(nid)) if (o !== id) crossings.push({ other_highway: o, node: nid, _go: 'node:' + nid });
  const nodeCount = new Set(nodesOfHw(id)).size;
  const segCols = ['order_on_highway', 'from_node', 'to_node', 'direction', 'kind', 'verified'];
  return `<div class="p">${head(h, h.color)}
    <div class="badges">${oriBadge(h)}${verifiedBadge(h)}<span class="badge n">درس ${toFa(h.level)}</span></div>
    <p class="plain">${plainOf(h)}<br>${endsText(h)}<br><small>${toFa(segs.length)} قطعه · ${toFa(nodeCount)} نقطه</small></p>
    ${unverifiedBox(h, 'بزرگراه')}${noteLine(h)}${h.official_name_fa ? `<div class="note">official_name_fa: ${esc(h.official_name_fa)}</div>` : ''}
    ${devDetails(DEV_TITLE,
      sql(HIDDEN + q(COLS.highways, 'highways', `id = '${id}'`)) + kvTable(COLS.highways, h) +
      sql(q(segCols, 'segments', `highway_id = '${id}'`).replace(';', '\nORDER BY order_on_highway;')) +
      listTable(segCols, segs.map(s => ({ ...s, _go: 'segment:' + s.id })), r => r._go) +
      sql(`-- which other highways share a node with '${id}'?\nSELECT DISTINCT o.highway_id AS other_highway, n.id AS node\nFROM segments m\nJOIN nodes n ON n.id IN (m.from_node, m.to_node)\nJOIN segments o ON n.id IN (o.from_node, o.to_node)\n  AND o.highway_id <> m.highway_id\nWHERE m.highway_id = '${id}';`) +
      (crossings.length ? listTable(['other_highway', 'node'], crossings, r => r._go) : '<div class="rows">(0 rows) — no other highway touches this one in the data</div>') +
      sourcesBlock([h]))}
    ${footer}</div>`;
}

function renderNode(id) {
  const n = ND.get(id), hws = hwsAtNode(id), color = hws.length === 1 ? HW.get(hws[0]).color : null;
  const names = hws.map(h => `<button class="go" data-go="highway:${h}">${esc(HW.get(h).name_fa)}</button>`);

function renderSegment(id) {

function renderLandmark(id) {

// ---------- map state in explore mode ----------
function focusSets() {
  const sel = E.sel; if (!sel) return { hw: null, nodes: null, lm: null };
  if (sel.type === 'highway') return { hw: new Set([sel.id]), nodes: new Set(nodesOfHw(sel.id)), lm: new Set() };
  if (sel.type === 'segment') { const s = SG.get(sel.id); return { hw: new Set([s.highway_id]), nodes: new Set([s.from_node, s.to_node]), lm: new Set() }; }
  if (sel.type === 'node') return { hw: new Set(hwsAtNode(sel.id)), nodes: new Set([sel.id]), lm: new Set() };
  return { hw: null, nodes: null, lm: new Set([sel.id]) };
}
function applyExploreView() {
  const { hw, nodes, lm } = focusSets();
  const inFilter = h => E.filter === 'all' || group(HW.get(h)) === E.filter;
  const nodeGhost = id => E.filter !== 'all' && !hwsAtNode(id).some(inFilter);
  svg.querySelectorAll('[data-highway]').forEach(el => {
    const id = el.dataset.highway;
    el.classList.toggle('dim', !!hw && !hw.has(id));
    el.classList.toggle('ghost', !inFilter(id));
    el.classList.toggle('sel', !!hw && hw.has(id)); // a selected highway is never greyed out by the filter
  });
  svg.querySelectorAll('.node[data-node]').forEach(el => {
    el.classList.toggle('dim', !!nodes && !nodes.has(el.dataset.node));
    el.classList.toggle('ghost', nodeGhost(el.dataset.node));
  });
  svg.querySelectorAll('.landmark[data-landmark]').forEach(el => el.classList.toggle('dim', !!E.sel && !(lm && lm.has(el.dataset.landmark))));
  clearHalos();
  if (E.sel) halo(E.sel.type, E.sel.id);
}
function clearExploreView() {
  svg.querySelectorAll('.dim,.ghost,.sel').forEach(el => el.classList.remove('dim', 'ghost', 'sel'));
  clearHalos();
}

const RENDER = { highway: renderHighway, node: renderNode, segment: renderSegment, landmark: renderLandmark };
const TABLE = { highway: HW, node: ND, segment: SG, landmark: LM };
function exploreSelect(type, id, opts = {}) {
  if (type && !(TABLE[type] && TABLE[type].has(id))) type = null;
  E.sel = type ? { type, id } : null;
  panel.innerHTML = type ? RENDER[type](id) : renderHome();
  panel.scrollTop = 0;
  applyExploreView();
  try { history.replaceState(null, '', type ? `#${type}=${encodeURIComponent(id)}` : location.pathname + location.search); } catch (_) { /* file:// in some browsers */ }
  if (type && !opts.noFocus) {
    const pts = type === 'highway' ? nodesOfHw(id).map(P) : type === 'segment' ? [P(SG.get(id).from_node), P(SG.get(id).to_node)] : [P(type === 'node' ? id : LM.get(id).node_id)];
    // zoom in only when the map is small (phones); on a big screen the whole map stays in view
    if (pane.clientWidth < 700) focusOn(pts, type === 'highway' ? 150 : 320); else focusAll();
  }
}
function exploreClick(e) {
  if (dragged || state.real) return;
  const t = e.target.closest('[data-segment],[data-node],[data-landmark],[data-highway]');
  if (!t) { if (E.sel) exploreSelect(null, null, { noFocus: true }); return; }
  if (t.dataset.segment) {
    const s = SG.get(t.dataset.segment);
    // first click = the whole highway, a second click on the same highway = the segment under the finger
    if (E.sel && E.sel.type === 'highway' && E.sel.id === s.highway_id) exploreSelect('segment', s.id, { noFocus: true });
    else exploreSelect('highway', s.highway_id, { noFocus: true });
  } else if (t.dataset.node) exploreSelect('node', t.dataset.node, { noFocus: true });
  else if (t.dataset.landmark) exploreSelect('landmark', t.dataset.landmark, { noFocus: true });
  else if (t.dataset.highway) exploreSelect('highway', t.dataset.highway, { noFocus: true });
}
function explorePanelClick(e) {
  if (e.target.closest('[data-close]')) return exploreSelect(null, null);
  const f = e.target.closest('[data-f]');
  if (f) { E.filter = f.dataset.f; panel.querySelectorAll('[data-f]').forEach(c => c.setAttribute('aria-pressed', String(c === f))); applyExploreView(); return; }
  const go = e.target.closest('[data-go]'); if (!go) return;
  const [type, ...rest] = go.dataset.go.split(':'); exploreSelect(type, rest.join(':'));
}
function enterExplore(sel) {
  state.mode = 'explore';
  clearCar();
  setVisible({ hw: null, landmarks: true, mountains: true, nodes: 'all' });
  if (sel) exploreSelect(sel.type, sel.id); else { E.sel = null; panel.innerHTML = renderHome(); applyExploreView(); focusAll(); }
}
function leaveExplore() { E.sel = null; clearExploreView(); try { history.replaceState(null, '', location.pathname + location.search); } catch (_) { /* ignore */ } }

function centerOf(id) { const ns = nodesOfHw(id).map(P); return [ns.reduce((s, p) => s + p[0], 0) / ns.length, ns.reduce((s, p) => s + p[1], 0) / ns.length]; }
// route points oriented so the car goes north (vertical lines) or east (horizontal lines)
function routeFor(id) {
  const pts = nodesOfHw(id).map(P), a = pts[0], b = pts[pts.length - 1], g = group(HW.get(id));
  const rev = g === 'NS' ? b[1] > a[1] : g === 'EW' ? b[0] < a[0] : false;
  return rev ? pts.reverse() : pts;
}

      vis: [], landmarks: true, focus: null, lmClick: true,

// ---------- question generators ----------

const choiceFrom = (arr, key) => shuffle(arr).map(o => ({ key: o[key], ...o }));
function mkChoices(items, correct) { return { choices: shuffle(items), correct }; }
const dirChoice = [{ key: 'N', fa: 'بالا ↑' }, { key: 'S', fa: 'پایین ↓' }, { key: 'E', fa: 'راست →' }, { key: 'W', fa: 'چپ ←' }];

const GEN = {
  mountain() {

  },

const PLAN = {
  0: ['mountain', 'dirword', 'landNS', 'landWE', 'dirword', 'landNS'],
  1: ['orient', 'orient', 'orient', 'rel', 'rel', 'dir', 'dir', 'neighbor'],
  2: ['orient', 'rel', 'dir', 'neighbor', 'neighbor', 'tapNode', 'tapNode', 'tapNode'],
  3: ['orient', 'orient', 'tapSpecial', 'isolated', 'neighbor', 'tapNode', 'dir', 'rel']
};
function buildQuiz(n) {
  const vis = hwUpTo(n), seen = new Set(), out = [];
  for (const kind of PLAN[n]) {
    for (let t = 0; t < 30; t++) {
      const q = GEN[kind](vis, n);
      if (!q) continue;
      if (seen.has(q.sig)) continue;
      seen.add(q.sig); q.id = `${n}-${out.length}`; out.push(q); break;
    }
  }
  return out;
}

// ---------- flow ----------
function applyStepView(s) {
  clearHalos(); clearCar(); document.querySelectorAll('.pulse').forEach(e => e.classList.remove('pulse'));
  setVisible({ hw: new Set(s.vis), landmarks: s.landmarks !== false, nodes: 'meet' });
  (s.halo || []).forEach(([t, id]) => halo(t, id));
  (s.pulse || []).forEach(sel => pulse(document.querySelector(sel), true));
  if (s.focus) focusOn(s.focus, 220); else focusAll();
  if (s.car) driveCar(s.car);
}
function startLevel(n) {
  if (!unlocked(n)) return;
  state.mode = 'learn'; setReal(false); leaveExplore();
  Object.assign(L, { n, phase: 'intro', steps: introSteps(n), si: 0, queue: [], qi: 0, first: new Map(), total: 0, q: null, answered: false, token: L.token + 1 });
  store.set('lastLevel', n);
  document.dispatchEvent(new CustomEvent('levelchange'));
  showIntro();
}
function showIntro() {
  const s = L.steps[L.si], last = L.si === L.steps.length - 1;
  applyStepView(s);
  card({ kicker: kickerOf(L.n, `${toFa(L.si + 1)} از ${toFa(L.steps.length)}`),
    bar: `<i style="width:${Math.round((L.si + 1) / (L.steps.length + 1) * 100)}%"></i>`, title: s.title, en: s.en, body: s.body,
    foot: `${s.dev ? devDetails(DEV_TITLE, devBlock(s.dev)) : ''}<div class="nextrow">${L.si ? '<button class="btn ghost" data-prev>◂ قبلی</button>' : '<span></span>'}<button class="btn" data-next>${last ? 'شروع سؤال‌ها ▸' : 'بعدی ▸'}</button></div>` });
  syncDev();
  document.querySelectorAll('[data-lm]').forEach(b => b.addEventListener('click', () => { clearHalos(); halo('landmark', b.dataset.lm); }));
}
function startQuiz() {
  L.phase = 'quiz'; L.queue = buildQuiz(L.n); L.total = L.queue.length; L.qi = 0; L.first = new Map();
  showQuestion();
}
function showQuestion() {
  const q = L.q = L.queue[L.qi]; L.answered = false; const token = ++L.token;
  clearHalos(); clearCar(); document.querySelectorAll('.pulse').forEach(e => e.classList.remove('pulse'));
  setVisible({ hw: hwUpTo(L.n), landmarks: true, nodes: 'meet' });
  q.setup();
  const dots = Array.from({ length: L.total }, (_, i) => { const r = L.first.get(L.queue.find(x => x.id === `${L.n}-${i}`)?.id); return `<span class="dot-p ${r === true ? 'ok' : r === false ? 'bad' : ''}"></span>`; }).join('');
  const choices = q.choices ? `<div class="choices">${(q.shown = shuffle(q.choices)).map(c => `<button class="choice" data-key="${esc(c.key)}"><span>${c.fa}</span>${c.en ? `<small dir="ltr">${esc(c.en)}</small>` : ''}</button>`).join('')}</div>` : '';
  card({ kicker: kickerOf(L.n, `سؤال ${toFa(Math.min(L.qi + 1, L.total))} از ${toFa(L.total)}`), bar: `<div class="dots">${dots}</div>`, title: q.fa, en: q.en || '', choices, hint: q.hint || '' });
  void token;
}
function reveal(ok, picked) {
  const q = L.q; L.answered = true;
  if (!L.first.has(q.id)) L.first.set(q.id, ok);
  if (!ok && !q.retried) { q.retried = true; const at = Math.min(L.qi + 4, L.queue.length); L.queue.splice(at, 0, q); }
  document.querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    if (q.choices && b.dataset.key === String(q.correct)) b.classList.add('right');
    else if (b.dataset.key === picked) b.classList.add('wrong');
  });
  const tip = document.querySelector('.tiphint'); if (tip) tip.remove();
  const last = L.qi >= L.queue.length - 1;
  document.getElementById('fb').innerHTML = `<div class="fbbox ${ok ? 'ok' : 'bad'}"><b>${ok ? 'آفرین! ✓' : 'نه، این‌طور نیست ✗'}</b> ${q.why}${!ok && q.retried ? '<br><small>این سؤال کمی بعدتر دوباره می‌آید.</small>' : ''}</div>`;
  document.getElementById('slot').innerHTML = `${rowLine(q.line)}${devDetails(DEV_TITLE, devBlock(q.dev))}<div class="nextrow"><span></span><button class="btn" data-next>${last ? 'نتیجه ▸' : 'ادامه ▸'}</button></div>`;
  syncDev();
  if (q.focusAfter) focusOn(q.focusAfter, 200);
  q.reveal();
  const b = document.querySelector('[data-next]'); if (b) b.focus({ preventScroll: true });
}
function answerChoice(key) { if (L.answered || !L.q || !L.q.choices) return; reveal(String(key) === String(L.q.correct), String(key)); }
function lessonClick(e) {
  if (dragged || state.real || L.phase !== 'quiz' || L.answered || !L.q || L.q.kind !== 'tap') return;
  const t = e.target.closest('[data-node],[data-highway]'); if (!t) return;
  if (L.q.tap === 'node' && t.dataset.node && ND.get(t.dataset.node).type === 'interchange') reveal(L.q.ok(t.dataset.node), t.dataset.node);
  else if (L.q.tap === 'highway' && t.dataset.highway) reveal(L.q.ok(t.dataset.highway), t.dataset.highway);
  else if (L.q.tap === 'node') document.getElementById('fb').innerHTML = '<div class="fbbox hint">برای این سؤال باید روی یک <b>دایره‌ی سفید</b> (تقاطع) بزنی.</div>';
}
function finishLevel() {
  L.phase = 'done'; clearHalos(); clearCar(); focusAll();
  const ids = [...L.first.keys()], right = ids.filter(id => L.first.get(id)).length, ratio = right / Math.max(1, ids.length), pass = ratio >= PASS;
  if (pass) { const p = progress(); p.passed[L.n] = true; store.set('progress', p); }
  document.dispatchEvent(new CustomEvent('levelchange'));
  const next = L.n + 1 < LEVELS.length;
  card({ kicker: kickerOf(L.n, 'نتیجه'), bar: '<i style="width:100%"></i>',
    title: pass ? 'عالی بود! 🎉' : 'کمی دیگر تمرین کنیم', body: `<p class="score"><b>${toFa(right)}</b> از ${toFa(ids.length)} سؤال را بار اول درست زدی.</p>
      <p>${pass ? (next ? `درس بعدی باز شد: <b>${LEVELS[L.n + 1].fa}</b>.` : 'همه‌ی درس‌های این نسخه را تمام کردی. درس ۴ (مسیریابی) هنوز ساخته نشده.') : 'برای باز شدن درس بعد حدود ۸۰٪ لازم است. دوباره امتحان کن؛ سؤال‌ها هر بار فرق می‌کنند.'}</p>`,
    foot: `<div class="nextrow"><button class="btn ghost" data-again>دوباره</button>${pass && next ? '<button class="btn" data-nextlevel>درس بعدی ▸</button>' : '<button class="btn" data-explore>کاوش آزاد ▸</button>'}</div>` });
}
function panelClickLearn(e) {
  const t = e.target;
  if (t.closest('[data-quit]')) { document.dispatchEvent(new CustomEvent('quit')); return; }
  if (t.closest('[data-prev]')) { L.si = Math.max(0, L.si - 1); showIntro(); return; }
  if (t.closest('[data-next]')) {
    if (L.phase === 'intro') { if (L.si < L.steps.length - 1) { L.si++; showIntro(); } else startQuiz(); }
    else if (L.phase === 'quiz') { if (L.qi >= L.queue.length - 1) finishLevel(); else { L.qi++; showQuestion(); } }
    return;
  }
  const c = t.closest('.choice'); if (c) return answerChoice(c.dataset.key);
  if (t.closest('[data-again]')) return startLevel(L.n);
  if (t.closest('[data-nextlevel]')) return startLevel(L.n + 1);
  if (t.closest('[data-explore]')) document.dispatchEvent(new CustomEvent('quit'));
}

// ===== main: header, mode switching, theme, buttons =====
const levelsNav = document.getElementById('levels');
function renderLevels() {
  const prog = progress();
  levelsNav.innerHTML = LEVELS.map(l => {
    const open = unlocked(l.n), done = !!prog.passed[l.n], cur = state.mode === 'learn' && L.n === l.n;
    return `<button class="lv${cur ? ' cur' : ''}${done ? ' done' : ''}" data-lv="${l.n}" ${open ? '' : 'disabled'} aria-current="${cur}" title="${esc(l.en)}">
      <span class="lvn">${open ? (done ? '✓' : toFa(l.n)) : '🔒'}</span><span class="lvt">${l.fa}</span></button>`;
  }).join('') + `<button class="lv" disabled title="Routing — coming in Phase 4"><span class="lvn">🔒</span><span class="lvt">مسیریابی</span></button>` +
    `<button class="lv${state.mode === 'explore' ? ' cur' : ''}" data-explore aria-current="${state.mode === 'explore'}"><span class="lvn">🧭</span><span class="lvt">کاوش آزاد</span></button>`;
  const cur = levelsNav.querySelector('.cur'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function setMode(mode) {
  state.mode = mode;
  document.body.dataset.mode = mode;
  const rb = document.getElementById('realbtn');
  // the real-shape view is for Level 2 and up, and for free exploring (as in the brief)
  rb.hidden = !(mode === 'explore' || (mode === 'learn' && L.n >= 2));
  renderLevels();
}
function goExplore(sel) {
  setReal(false);
  setMode('explore');
  enterExplore(sel);
  renderLevels();
}
function goLevel(n) {
  startLevel(n);
  setMode('learn');
}

levelsNav.addEventListener('click', e => {
  const lv = e.target.closest('[data-lv]'); if (lv) return goLevel(+lv.dataset.lv);
  if (e.target.closest('[data-explore]')) goExplore();
});
document.addEventListener('levelchange', renderLevels);
document.addEventListener('quit', () => goExplore());

// the map and the panel send their clicks to whichever mode is active
svg.addEventListener('click', e => (state.mode === 'explore' ? exploreClick(e) : lessonClick(e)));
panel.addEventListener('click', e => (state.mode === 'explore' ? explorePanelClick(e) : panelClickLearn(e)));
panel.addEventListener('keydown', e => {
  const go = e.target.closest && e.target.closest('tr[data-go]');
  if (go && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); go.click(); }
});
svg.querySelectorAll('.hw-label,.landmark,.hit-node').forEach(el => {
  const type = el.dataset.highway ? 'highway' : el.dataset.landmark ? 'landmark' : 'node';
  const id = el.dataset.highway || el.dataset.landmark || el.dataset.node, row = TABLE[type].get(id);
  el.setAttribute('tabindex', '0'); el.setAttribute('role', 'button'); el.setAttribute('aria-label', `${row.name_fa || row.name_en || id} (${row.name_en || id})`);
  el.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (state.mode === 'explore') exploreSelect(type, id); else el.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.mode === 'explore' && E.sel) exploreSelect(null, null); });

// ---------- map buttons ----------
document.getElementById('zin').addEventListener('click', () => zoomBy(1.4));
document.getElementById('zout').addEventListener('click', () => zoomBy(1 / 1.4));
document.getElementById('zall').addEventListener('click', focusAll);
document.getElementById('realbtn').addEventListener('click', () => {
  setReal(!state.real);
  if (state.mode === 'explore') { E.sel = null; applyExploreView(); }
  if (!state.real && state.mode === 'learn' && L.phase === 'quiz' && L.q && !L.answered) L.q.setup();
});
document.getElementById('devbtn').addEventListener('click', e => {
  state.dev = !state.dev; store.set('dev', state.dev);
  e.currentTarget.setAttribute('aria-pressed', String(state.dev)); syncDev();
});
document.getElementById('openall').addEventListener('click', () => { store.set('openAll', true); renderLevels(); document.getElementById('openall').hidden = true; });

// ---------- theme ----------
const root = document.documentElement;
{ const t = store.get('theme', null); if (t) root.dataset.theme = t; }
document.getElementById('theme').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', root.dataset.theme);
});

// ---------- start ----------
state.dev = store.get('dev', false);
document.getElementById('devbtn').setAttribute('aria-pressed', String(state.dev));
document.body.classList.toggle('dev-on', state.dev);
document.getElementById('openall').hidden = LEVELS.every(l => unlocked(l.n));
{
  const m = /^#(highway|node|segment|landmark)=(.+)$/.exec(location.hash);
  if (m) goExplore({ type: m[1], id: decodeURIComponent(m[2]) });
  else { const prog = progress(); goLevel(Math.max(0, LEVELS.findIndex(l => !prog.passed[l.n]) === -1 ? 0 : LEVELS.findIndex(l => !prog.passed[l.n]))); }
}
window.addEventListener('hashchange', () => {
  const m = /^#(highway|node|segment|landmark)=(.+)$/.exec(location.hash);
  if (m && !(state.mode === 'explore' && E.sel && E.sel.type === m[1] && E.sel.id === decodeURIComponent(m[2]))) goExplore({ type: m[1], id: decodeURIComponent(m[2]) });
});
// small hook so the browser test can play the quiz without guessing
window.__tehran = { L, GEN, LEVELS, state, buildQuiz, hwUpTo, answerRight: () => { const q = L.q; if (!q) return false; if (q.choices) answerChoice(q.correct); else if (q.tap === 'node') lessonClick({ target: svg.querySelector(`.hit-node[data-node="${D.nodes.find(n => n.type === 'interchange' && q.ok(n.id)).id}"]`) }); else if (q.tap === 'highway') lessonClick({ target: svg.querySelector(`.hw-label[data-highway="${D.highways.find(h => q.ok(h.id)).id}"]`) }); return true; } };

})();</script>
